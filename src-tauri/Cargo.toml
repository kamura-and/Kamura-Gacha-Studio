[package]
name = "app"
version = "0.1.0"
description = "Kamura Gacha Studio"
authors = ["Kamura"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
rcon = { version = "0.6.0", features = ["rt-tokio"] }
tokio = { version = "1", features = ["net"] }
